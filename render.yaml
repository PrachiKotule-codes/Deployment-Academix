# Render Blueprint for a college-demo deployment of Academix.
# Review current Render plan availability before applying this blueprint.
databases:
  - name: academix-postgres
    databaseName: academix_submission
    user: academix_user
    plan: free
    region: singapore

services:
  - type: web
    name: academix-portal
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: academix-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: ACADEMIX_SEED_DEMO_DATA
        value: "false"
