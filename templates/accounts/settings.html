{% extends "base.html" %}{% block title %}Profile settings{% endblock %}{% block content %}<div class="page-heading"><div><div class="breadcrumbs">Account <span>›</span> Settings</div><h1>Profile settings</h1><p class="muted">Keep your personal details up to date.</p></div></div><section class="panel form-panel"><form method="post" class="stack-form">{% csrf_token %}<div class="form-grid"><div class="form-field"><label>First name</label><input class="field-input" name="first_name" value="{{ user.first_name }}" required></div><div class="form-field"><label>Last name</label><input class="field-input" name="last_name" value="{{ user.last_name }}"></div><div class="form-field"><label>Email</label><input type="email" class="field-input" name="email" value="{{ user.email }}"></div><div class="form-field"><label>Phone</label><input class="field-input" name="phone" value="{{ profile.phone }}"></div><div class="form-field"><label>Username</label><input class="field-input" value="{{ user.username }}" disabled></div><div class="form-field"><label>Role</label><input class="field-input" value="{{ profile.get_role_display }}" disabled></div>{% if profile.class_name %}<div class="form-field"><label>Class</label><input class="field-input" value="{{ profile.class_name }} {{ profile.division }}" disabled></div>{% endif %}</div><div class="form-actions"><button class="btn btn-primary">Save settings</button></div></form></section>{% endblock %}
